function sumArrayAsync(array) {
  return new Promise((resolve, reject) => {
    if (array.length === 0) {
      reject("arr empty");
      return;
    }

    let sum = 0;
    let index = 0;

    function addNext() {
      if (index >= array.length) {
        resolve(sum);
        return;
      }
      setTimeout(() => {
        sum += array[index];
        index++;
        addNext();
      }, 1000);
    }

    addNext();
  });
}

async function anathrMain() {
  try {
    const result = await sumArrayAsync([4, 5, 6, 7, 8]);
    console.log("sum arr:", result); 
  } catch (error) {
    console.error("errpr:", error);
  }
}

anathrMain();
