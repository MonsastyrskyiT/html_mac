<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Випадковий хвостик</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      color: #23302a;
      background: #f2f7f1;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(520px, 100%);
      padding: 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #dce8dc;
      border-radius: 20px;
      box-shadow: 0 14px 40px rgb(35 48 42 / 10%);
    }

    h1 {
      margin: 0 0 10px;
      color: #285d43;
      font-size: clamp(27px, 6vw, 36px);
    }

    p {
      margin: 0 0 22px;
      color: #5b6b61;
      line-height: 1.5;
    }

    button {
      min-height: 48px;
      padding: 12px 22px;
      color: #fff;
      background: #34845a;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #286c47;
    }

    button:focus-visible {
      outline: 3px solid #9ac9a9;
      outline-offset: 3px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      min-height: 24px;
      margin: 18px 0 0;
      color: #52665a;
      font-weight: 600;
    }

    .status.error {
      color: #b42318;
    }

    .dog-image {
      display: block;
      width: 100%;
      max-height: 420px;
      margin-top: 22px;
      object-fit: contain;
      border-radius: 12px;
      background: #f2f7f1;
    }

    .dog-image[hidden] {
      display: none;
    }

    @media (max-width: 480px) {
      main {
        padding: 26px 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Знайди хвостатого друга</h1>
    <p>Натисни кнопку — і ми покажемо тобі випадкового песика.</p>
    <button id="dog-button" type="button">Показати песика</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <img class="dog-image" id="dog-image" alt="Випадковий песик" hidden>
  </main>

  <script>
    const button = document.querySelector('#dog-button');
    const status = document.querySelector('#status');
    const image = document.querySelector('#dog-image');

    function waitForImageLoad() {
      return new Promise((resolve, reject) => {
        image.addEventListener('load', resolve, { once: true });
        image.addEventListener('error', () => reject(new Error('Image failed to load.')), { once: true });
      });
    }

    async function showRandomDog() {
      button.disabled = true;
      status.classList.remove('error');
      status.textContent = 'Шукаємо хвостика...';
      image.hidden = true;
      image.removeAttribute('src');

      try {
        const response = await fetch('https://dog.ceo/api/breeds/image/random');

        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }

        const data = await response.json();

        if (data.status !== 'success' || typeof data.message !== 'string') {
          throw new Error('The API did not return a dog image.');
        }

        const imageLoaded = waitForImageLoad();
        image.src = data.message;
        image.hidden = false;
        await imageLoaded;
        status.textContent = '';
      } catch {
        image.hidden = true;
        image.removeAttribute('src');
        status.classList.add('error');
        status.textContent = 'Не вдалося завантажити фото. Спробуйте ще раз';
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener('click', showRandomDog);
  </script>
</body>
</html>
