<!DOCTYPE html>

<head>

    }

<body>
  <main>
    <h1>Асинхронні завдання</h1>

    <div class="tasks">
      <section>
        <h2>Завдання 1 — множення</h2>
        <p>Обчислення: <code>6 × 9</code></p>
        <button id="multiply-button" type="button">Обчислити ще раз</button>
        <div class="result loading" id="multiply-result" aria-live="polite">
          Обчислення триває 2 секунди...
        </div>
      </section>

      <section>
        <h2>Завдання 2 — сортування масиву</h2>
        <p>Початковий масив: <code>[12, 3, 8, 1, 25, 6]</code></p>
        <button id="sort-button" type="button">Сортувати ще раз</button>
        <div class="result loading" id="sort-result" aria-live="polite">
          Сортування триває 2 секунди...
        </div>
      </section>
    </div>
  </main>

  <script>
    const multiplyResult = document.querySelector('#multiply-result');
    const sortResult = document.querySelector('#sort-result');
    const multiplyButton = document.querySelector('#multiply-button');
    const sortButton = document.querySelector('#sort-button');

    // Завдання 1
    function multiplyAsync(a, b) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          const valuesAreNumbers =
            typeof a === 'number' &&
            typeof b === 'number' &&
            Number.isFinite(a) &&
            Number.isFinite(b);

          if (!valuesAreNumbers) {
            reject(new Error('Некоректні значення'));
            return;
          }

          resolve(a * b);
        }, 2000);
      });
    }

    async function runMultiplication() {
      multiplyButton.disabled = true;
      multiplyResult.className = 'result loading';
      multiplyResult.textContent = 'Обчислення триває 2 секунди...';

      try {
        const result = await multiplyAsync(6, 9);
        multiplyResult.className = 'result';
        multiplyResult.textContent = `Результат множення: ${result}`;
        console.log('Результат множення:', result);
      } catch (error) {
        multiplyResult.className = 'result error';
        multiplyResult.textContent = error.message;
        console.error(error.message);
      } finally {
        multiplyButton.disabled = false;
      }
    }

    // Завдання 2
    function sortArrayAsync(array) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (array.length === 0) {
            reject(new Error('Масив порожній'));
            return;
          }

          const sortedArray = [...array].sort((a, b) => a - b);
          resolve(sortedArray);
        }, 2000);
      });
    }

    async function runSorting() {
      const numbers = [12, 3, 8, 1, 25, 6];

      sortButton.disabled = true;
      sortResult.className = 'result loading';
      sortResult.textContent = 'Сортування триває 2 секунди...';

      try {
        const sortedArray = await sortArrayAsync(numbers);
        sortResult.className = 'result';
        sortResult.textContent = `Відсортований масив: ${JSON.stringify(sortedArray)}`;
        console.log('Відсортований масив:', sortedArray);
      } catch (error) {
        sortResult.className = 'result error';
        sortResult.textContent = error.message;
        console.error(error.message);
      } finally {
        sortButton.disabled = false;
      }
    }

    async function main() {
      await Promise.all([runMultiplication(), runSorting()]);
    }

    multiplyButton.addEventListener('click', runMultiplication);
    sortButton.addEventListener('click', runSorting);

    main();

    multiplyAsync('6', 9).catch((error) => console.error(error.message));
    sortArrayAsync([]).catch((error) => console.error(error.message));
  </script>
</body>
</html>
